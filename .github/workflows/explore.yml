name: Explorer v86 (temporaire)

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner v86
        run: git clone --depth 1 https://github.com/copy/v86 /tmp/v86

      - name: Alpine (Dockerfile et scripts)
        run: |
          cd /tmp/v86
          ls -la tools/docker/ tools/docker/alpine/ || true
          for f in tools/docker/alpine/*; do echo "=================== $f"; cat "$f"; done

      - name: Docs
        run: |
          cd /tmp/v86
          ls docs/
          echo "=================== networking.md"; cat docs/networking.md
          echo "=================== alpine.md"; cat docs/alpine.md 2>/dev/null || true

      - name: Options réseau et fonctions clavier dans v86.d.ts
        run: |
          cd "$(mktemp -d)" && npm init -y >/dev/null && npm install v86 >/dev/null
          grep -n -i -E "relay|wisp|fetch|net_device|network|keyboard_send|keyboard_set|save_state|restore_state|filesystem|initrd|bzimage|cmdline|wasm_path|wasm_fn|serial|screen" node_modules/v86/v86.d.ts | head -150
          echo "=================== version"; grep '"version"' node_modules/v86/package.json
