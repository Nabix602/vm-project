name: Construire, tester et publier la VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # L'image Linux met du temps à se construire : on la garde en cache tant que le Dockerfile ne change pas
      - name: Récupérer l'image Linux en cache
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: image-out
          key: image-v1-${{ hashFiles('image/**', 'scripts/build-image.sh') }}

      - name: Construire l'image Linux
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y zstd
          bash scripts/build-image.sh

      # Sauvegardé tout de suite : même si un test échoue plus loin, l'image n'est pas reconstruite
      - name: Mettre l'image en cache
        if: steps.imgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: image-out
          key: image-v1-${{ hashFiles('image/**', 'scripts/build-image.sh') }}

      - name: Assembler le site
        run: bash scripts/build.sh

      - name: Installer le navigateur de test
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Tester le site dans un vrai navigateur
        run: |
          python3 -m http.server 8080 --directory dist >/dev/null 2>&1 &
          sleep 2
          node tests/e2e.mjs

      - name: Garder les captures et journaux du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: tests/out
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Dernier contrôle : on rejoue les tests sur l'adresse publique, comme le ferait un visiteur
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le navigateur de test
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Tester le site publié
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/vm-project/
          OUT_DIR: tests/out-public
        run: |
          for i in $(seq 1 30); do curl -fsI "$BASE_URL" >/dev/null && break; sleep 10; done
          node tests/e2e.mjs
