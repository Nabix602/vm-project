name: Expérience fluidité (temporaire)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de tests/ à lancer"
        required: false
        default: "exp-perf.mjs"
      variants:
        description: "Variantes en JSON (vide = liste par défaut)"
        required: false
        default: ""

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer l'image Linux en cache
        uses: actions/cache/restore@v4
        with:
          path: image-out
          key: image-v1-${{ hashFiles('image/**', 'scripts/build-image.sh') }}
          fail-on-cache-miss: true
      - run: bash scripts/build.sh
      - working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium
      - env:
          VARIANTS: ${{ github.event.inputs.variants }}
        run: |
          python3 -m http.server 8080 --directory dist >/dev/null 2>&1 &
          sleep 2
          node tests/${{ github.event.inputs.script || 'exp-perf.mjs' }}
