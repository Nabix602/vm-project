<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau Web 11</title>
<link rel="stylesheet" href="build/xterm.css">
<style>
:root{--accent:#0067c0;--win:#f3f3f3;--card:#fbfbfb;--text:#1a1a1a;--muted:#616161;--bar:rgba(243,243,243,.85);--line:rgba(0,0,0,.1);--hover:rgba(0,0,0,.055);--sel:rgba(0,103,192,.14);--shadow:0 8px 32px rgba(0,0,0,.28)}
body.dark{--accent:#60cdff;--win:#202020;--card:#2b2b2b;--text:#fff;--muted:#a0a0a0;--bar:rgba(32,32,32,.85);--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--sel:rgba(96,205,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;font-size:14px;color:var(--text);user-select:none}
svg{display:block}
#desk{position:fixed;inset:0 0 48px 0;overflow:hidden;background:var(--wall);background-size:cover}
#icons{position:absolute;inset:0;padding:6px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start}
.dicon{width:86px;padding:6px 2px;text-align:center;color:#fff;font-size:12px;border-radius:4px;text-shadow:0 1px 3px #000b;border:1px solid transparent}
.dicon:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.dicon .g{width:40px;height:40px;margin:0 auto 4px}
.ico{width:100%;height:100%}
#task{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--bar);backdrop-filter:blur(30px) saturate(1.5);border-top:1px solid var(--line);z-index:9000}
#items{position:absolute;left:50%;top:0;height:48px;transform:translateX(-50%);display:flex;align-items:center;gap:2px}
.tb{height:40px;min-width:44px;padding:0 6px;border:0;background:transparent;border-radius:6px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;position:relative;font:inherit}
.tb:hover{background:var(--hover)}.tb:active{transform:scale(.92)}
.tb .g{width:24px;height:24px}
.tb.run::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#8a8a8a;transition:width .15s,margin .15s}
.tb.act{background:var(--hover)}.tb.act::after{width:16px;margin-left:-8px;background:var(--accent)}
.search{width:200px;height:34px;border-radius:17px;background:var(--hover);border:1px solid var(--line);justify-content:flex-start;padding:0 12px;color:var(--muted);font-size:13px}
#tray{position:absolute;right:0;top:0;height:48px;display:flex;align-items:center;gap:2px;padding-right:6px}
#tray .pill{height:40px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.2;text-align:right}
#tray .pill:hover{background:var(--hover)}
#vmdot{width:9px;height:9px;border-radius:50%;background:#e5a500}
#vmdot.ok{background:#3fb950}#vmdot.err{background:#e5484d}
#start{position:fixed;left:50%;bottom:56px;width:640px;max-width:98vw;height:660px;max-height:calc(100vh - 66px);margin-left:-320px;background:var(--bar);backdrop-filter:blur(40px) saturate(1.6);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:9100;display:none;flex-direction:column;overflow:hidden}
#start.open{display:flex;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#start .top{padding:24px 32px 8px}
#q{width:100%;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);border-bottom:2px solid var(--accent);background:var(--card);color:var(--text);font:inherit;outline:0}
#start .mid{flex:1;overflow:auto;padding:8px 32px}
#start h4{margin:12px 0 8px;font-size:14px;font-weight:600}
#apps{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.app{padding:10px 2px 8px;text-align:center;border-radius:6px;font-size:12px}
.app:hover{background:var(--hover)}.app .g{width:30px;height:30px;margin:0 auto 6px}
#rec{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.recrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;font-size:12px}
.recrow:hover{background:var(--hover)}.recrow .g{width:28px;height:28px;flex:none}.recrow small{display:block;color:var(--muted)}
#pwr{height:64px;background:rgba(127,127,127,.12);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative}
#pwr .u{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600}
body.dark .av{color:#000}
.pbtn{width:40px;height:40px;border-radius:6px;border:0;background:transparent;color:var(--text);display:grid;place-items:center}
.pbtn:hover{background:var(--hover)}
#pm{position:absolute;right:32px;bottom:60px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;display:none;box-shadow:var(--shadow);min-width:210px}
#pm.open{display:block}#pm div{padding:8px 12px;border-radius:4px}#pm div:hover{background:var(--hover)}
.win{position:absolute;background:var(--win);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:280px;min-height:160px}
.win.max{inset:0 !important;width:auto !important;height:auto !important;border-radius:0}
.win.min{display:none}
.win.opening{animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.tbar{height:36px;display:flex;align-items:center;padding-left:12px;gap:8px;font-size:12px;flex:none;background:var(--bar)}
.tbar .wi{width:16px;height:16px}.tbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar button{width:46px;height:36px;border:0;background:transparent;color:var(--text);display:grid;place-items:center}
.tbar button:hover{background:var(--hover)}.tbar button.x:hover{background:#c42b1c;color:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
textarea.np{flex:1;border:0;resize:none;padding:10px 12px;font:14px Consolas,"Cascadia Mono",monospace;background:var(--card);color:var(--text);outline:none}
.tool{display:flex;gap:6px;padding:6px 8px;align-items:center;flex-wrap:wrap;flex:none}
.tool button,.btn{padding:5px 12px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px}
.tool button:hover,.btn:hover{background:var(--hover)}.btn.pri{background:var(--accent);color:#fff;border-color:transparent}body.dark .btn.pri{color:#000}
.tool input,.field{flex:1;min-width:80px;padding:5px 10px;border-radius:4px;border:1px solid var(--line);border-bottom:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;outline:0;user-select:text}
.tool input:focus,.field:focus{border-bottom-color:var(--accent)}
.split{flex:1;min-height:0;display:flex}
.nav{width:170px;flex:none;padding:6px;overflow:auto;border-right:1px solid var(--line)}
.nav div{padding:7px 10px;border-radius:4px;display:flex;gap:8px;align-items:center;font-size:13px}
.nav div:hover{background:var(--hover)}.nav div.on{background:var(--sel)}
.nav h5{margin:10px 10px 4px;font-size:11px;color:var(--muted);font-weight:600}
.list{flex:1;overflow:auto;padding:4px 6px;background:var(--card);margin:0 6px 6px 0;border-radius:6px}
.row{padding:6px 10px;border-radius:4px;display:flex;gap:10px;align-items:center;font-size:13px}
.row:hover{background:var(--hover)}.row.sel{background:var(--sel)}.row .g{width:20px;height:20px;flex:none}
.status{padding:4px 12px;font-size:12px;color:var(--muted);flex:none}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;flex:1;background:var(--win)}
.calc .scr{grid-column:1/5;text-align:right;font-size:36px;padding:14px 10px;min-height:76px;overflow:hidden;font-weight:600}
.calc button{font:inherit;font-size:18px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text)}
.calc button:hover{background:var(--hover)}.calc button.eq{background:var(--accent);color:#fff;border-color:transparent}body.dark .calc button.eq{color:#000}
iframe{flex:1;border:0;width:100%;background:#fff}
.set{padding:18px 24px;overflow:auto;flex:1}.set h3{margin:18px 0 8px;font-weight:600}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;margin-right:8px;border:2px solid var(--line)}
.term{flex:1;min-height:0;background:#0c0c0c;padding:6px 0 0 8px;overflow:hidden}
.term .xterm-viewport{background:transparent !important}
.store{flex:1;overflow:auto;padding:12px 16px}
.pkg{display:flex;align-items:center;gap:12px;padding:10px;border-radius:6px;background:var(--card);margin-bottom:8px;border:1px solid var(--line)}
.pkg .g{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.pkg .n{flex:1}.pkg small{display:block;color:var(--muted)}
#menu{position:fixed;z-index:9500;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;display:none;box-shadow:var(--shadow);min-width:200px}
#menu div{padding:7px 12px;border-radius:4px}#menu div:hover{background:var(--hover)}
#toast{position:fixed;right:16px;bottom:62px;z-index:9600;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow);display:none;max-width:320px}
#boot{position:fixed;inset:0;z-index:99999;background:#0a1a33;display:none;place-items:center;color:#fff}
#boot .c{background:#13294b;border:1px solid #2b4a7a;border-radius:12px;padding:24px;width:min(420px,92vw)}
#boot button{margin:6px 6px 0 0;padding:9px 14px;border-radius:6px;border:0;background:#60cdff;color:#000;font:inherit}
</style>
</head>
<body class="dark">
<div id="desk"><div id="icons"></div></div>
<div id="start">
  <div class="top"><input id="q" placeholder="Tapez ici pour rechercher" autocomplete="off"></div>
  <div class="mid">
    <h4>Épinglées</h4><div id="apps"></div>
    <h4>Recommandés</h4><div id="rec"></div>
  </div>
  <div id="pwr"><div class="u"><div class="av">U</div><span>Utilisateur</span></div>
    <button class="pbtn" id="pbtn" title="Alimentation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    <div id="pm"><div id="p-save">💾 Sauvegarder Linux</div><div id="p-gui">🖥️ Linux graphique (nouvel onglet)</div><div id="p-back">↩ Retour à l'accueil</div></div>
  </div>
</div>
<div id="task"><div id="items"></div>
  <div id="tray"><div class="pill" id="vmpill" title="Machine Linux"><span id="vmdot"></span><span id="vmtxt">Linux</span></div><div class="pill" id="clock"></div></div>
</div>
<div id="menu"></div>
<div id="toast"></div>
<div id="boot"><div class="c"><h3 style="margin-top:0">Une session Linux est sauvegardée</h3><p style="opacity:.8">Tu veux la reprendre ou démarrer un Linux tout neuf ?</p><button id="b-res">Reprendre</button><button id="b-new">Démarrer à neuf</button></div></div>
<div id="vmhidden" style="display:none"><div></div><canvas></canvas></div>
<script src="config.js"></script>
<script src="build/libv86.js"></script>
<script src="build/xterm.js"></script>
<script src="linux.js"></script>
<script src="win.js"></script>
</body>
</html>
